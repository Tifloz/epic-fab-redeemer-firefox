name: AMO submission

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: amo-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and submit tagged version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NO_UPDATE_NOTIFIER: '1'
    permissions:
      contents: write
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked development tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Lint Firefox extension
        run: npm run lint

      - name: Build release source package
        run: npm run build

      - name: Submit to AMO and create draft release
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          AMO_LICENSE: ${{ vars.AMO_LICENSE }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/prepare-release.mjs
